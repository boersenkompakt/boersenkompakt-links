<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <title>Börsen Kompakt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f1a;
      background-image: 
        linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #0a0f1a;
      border: 2px solid #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      font-weight: 700;
      color: #22c55e;
      letter-spacing: -0.5px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.03em;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: transparent;
      border: 1.5px solid #22c55e;
      border-radius: 50px;
      padding: 14px 24px;
      color: #22c55e;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
    }

    a.link:hover {
      background: #22c55e;
      color: #0a0f1a;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
    }

    a.link svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 36px;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 0.05em;
    }

    .footer span {
      color: #22c55e;
    }
  </style>
</head>
